<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { font-family: sans-serif; font-size: 12px; color: #666; margin: 5px; }
  </style>
</head>
<body>
  <div id="status">Initializing...</div>

  <script>
    let hasUpdated = false;

    // 1. Request full access and define the column mapping configuration
    grist.ready({
      requiredAccess: 'full',
      columns: [
        { name: 'lastSeen', title: 'Last Seen Field', type: 'DateTime', optional: false }
      ]
    });

    // 2. React to record selection and column mappings
    grist.onRecord(async (record, mappings) => {
      const statusEl = document.getElementById('status');

      // Verify that the user mapped the 'Last Seen' field in the Grist right panel
      if (!mappings || !mappings.lastSeen) {
        statusEl.innerText = "Please select the 'Last Seen Field' in the Widget side panel ->";
        return;
      }

      if (!record) {
        statusEl.innerText = "No user record selected.";
        return;
      }

      // Prevent infinite loops (updating table triggers onRecord again)
      if (hasUpdated) return;
      hasUpdated = true;

      try {
        const table = grist.getTable();
        const colId = mappings.lastSeen;
        const nowInSeconds = Date.now() / 1000; // Grist DateTime uses UTC timestamps in seconds

        await table.update({
          id: record.id,
          fields: {
            [colId]: nowInSeconds
          }
        });

        statusEl.innerText = `Updated 'Last Seen' timestamp.`;
      } catch (err) {
        statusEl.innerText = "Error updating timestamp.";
        console.error("Failed to update last seen:", err);
      }
    });
  </script>
</body>
</html>
