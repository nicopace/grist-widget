<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: monospace;
      font-size: 11px;
      margin: 8px;
      background: #f8f9fa;
      color: #212529;
    }
    .log-entry { margin-bottom: 4px; padding: 4px 6px; border-radius: 3px; word-break: break-all; }
    .info { background: #e3f2fd; color: #0d47a1; }
    .success { background: #e8f5e9; color: #1b5e20; }
    .warn { background: #fff3e0; color: #e65100; }
    .error { background: #ffebee; color: #b71c1c; }
  </style>
</head>
<body>
  <div id="logs"></div>

  <script>
    // Name of the helper ping table created in Step 1
    const PING_TABLE_NAME = "UserPing"; 

    const logContainer = document.getElementById('logs');
    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.appendChild(entry);
      console.log(`[${type.toUpperCase()}]`, message);
    }

    let hasUpdated = false;

    log("Initializing 'Last Seen' widget...");

    try {
      grist.ready({
        requiredAccess: 'full',
        columns: [
          { name: 'userEmail', title: 'User Email Field', type: 'Text', optional: false },
          { name: 'lastSeen', title: 'Last Seen Field', type: 'DateTime', optional: false }
        ]
      });
      log("grist.ready() sent successfully.");
    } catch (e) {
      log(`Error during grist.ready(): ${e.message}`, 'error');
    }

    grist.onRecords(async (records, mappings) => {
      if (!mappings || !mappings.userEmail || !mappings.lastSeen) {
        log("Action required: Map both 'User Email Field' and 'Last Seen Field' in Widget side panel ->", "warn");
        return;
      }

      if (hasUpdated) return;

      log("Resolving active user via trigger formula ping...");

      try {
        const pingTable = grist.getTable(PING_TABLE_NAME);
        
        // 1. Create temporary record in UserPing table
        const createdRes = await pingTable.create({ fields: {} });
        const createdId = Array.isArray(createdRes) ? createdRes[0].id : (createdRes.id || createdRes);
        log(`Created temporary ping record #${createdId}.`);

        // 2. Fetch records from UserPing to read server-calculated $user.Email
        const pingRecords = await pingTable.getRecords();
        const myPing = pingRecords.find(r => r.id === createdId);
        const activeEmail = myPing ? myPing.User_Email : null;

        // 3. Delete temporary ping record
        await pingTable.destroy([createdId]);
        log(`Cleaned up ping record #${createdId}.`);

        if (!activeEmail) {
          log(`Could not resolve user email. Check that table '${PING_TABLE_NAME}' has column 'User_Email' with formula $user.Email.`, "error");
          return;
        }

        log(`Active user resolved: ${activeEmail}`);

        // 4. Locate user row in target table and update timestamp
        const emailCol = mappings.userEmail;
        const lastSeenCol = mappings.lastSeen;

        const targetRecord = records.find(r => 
          r[emailCol] && String(r[emailCol]).trim().toLowerCase() === activeEmail.trim().toLowerCase()
        );

        if (!targetRecord) {
          log(`No row found in main table where '${emailCol}' matches '${activeEmail}'.`, "warn");
          return;
        }

        log(`Updating Row #${targetRecord.id}...`);

        const mainTable = grist.selectedTable || grist.getTable();
        const nowInSeconds = Math.floor(Date.now() / 1000);

        hasUpdated = true;

        await mainTable.update({
          id: targetRecord.id,
          fields: {
            [lastSeenCol]: nowInSeconds
          }
        });

        log(`✓ Updated 'Last Seen' for ${activeEmail} on Row #${targetRecord.id}!`, 'success');

      } catch (err) {
        hasUpdated = false;
        log(`Ping workflow failed: ${err.message || err}`, 'error');
        console.error("Full error:", err);
      }
    });
  </script>
</body>
</html>
