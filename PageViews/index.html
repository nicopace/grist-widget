<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: monospace;
      font-size: 11px;
      margin: 8px;
      background: #f8f9fa;
      color: #212529;
    }
    .log-entry { margin-bottom: 4px; padding: 4px 6px; border-radius: 3px; word-break: break-all; }
    .info { background: #e3f2fd; color: #0d47a1; }
    .success { background: #e8f5e9; color: #1b5e20; }
    .warn { background: #fff3e0; color: #e65100; }
    .error { background: #ffebee; color: #b71c1c; }
  </style>
</head>
<body>
  <div id="logs"></div>

  <script>
    const logContainer = document.getElementById('logs');

    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.appendChild(entry);
      console.log(`[${type.toUpperCase()}]`, message);
    }

    let hasUpdated = false;

    log("Initializing 'Last Seen' widget...");

    try {
      // 1. Register required access and map TWO columns in Grist panel
      grist.ready({
        requiredAccess: 'full',
        columns: [
          { name: 'userEmail', title: 'User Email Field', type: 'Text', optional: false },
          { name: 'lastSeen', title: 'Last Seen Field', type: 'DateTime', optional: false }
        ]
      });
      log("grist.ready() sent successfully.");
    } catch (e) {
      log(`Error during grist.ready(): ${e.message}`, 'error');
    }

    // Helper: Obtain the logged-in user's email via Grist Access Token
    async function getCurrentUserEmail() {
      try {
        const tokenInfo = await grist.docApi.getAccessToken();
        
        // 1. Try profile API query
        try {
          const res = await fetch(`${tokenInfo.baseUrl}/profile/user?auth=${tokenInfo.token}`);
          if (res.ok) {
            const profile = await res.json();
            if (profile && profile.email) return profile.email;
          }
        } catch (e) {
          // Fallback to JWT payload
        }

        // 2. Decode JWT payload fallback
        if (tokenInfo && tokenInfo.token) {
          const parts = tokenInfo.token.split('.');
          if (parts.length === 3) {
            const payload = JSON.parse(atob(parts[1]));
            if (payload.email) return payload.email;
            if (payload.user && payload.user.email) return payload.user.email;
          }
        }
      } catch (err) {
        log(`Failed to retrieve user token: ${err.message || err}`, 'error');
      }
      return null;
    }

    // 2. Listen to ALL records in the table via onRecords
    grist.onRecords(async (records, mappings) => {
      log(`onRecords received ${records ? records.length : 0} rows.`);

      // Check for column mappings
      if (!mappings || !mappings.userEmail || !mappings.lastSeen) {
        log("Action required: Map both 'User Email Field' and 'Last Seen Field' in the Widget side panel ->", "warn");
        return;
      }

      if (hasUpdated) {
        log("Timestamp already updated for this page session.", "info");
        return;
      }

      log("Detecting active user email...");
      const userEmail = await getCurrentUserEmail();

      if (!userEmail) {
        log("Could not detect active user email. Ensure 'Full Document Access' is granted.", "error");
        return;
      }

      log(`Active user: ${userEmail}`);

      const emailCol = mappings.userEmail;
      const lastSeenCol = mappings.lastSeen;

      // Find the row matching the current user's email
      const targetRecord = records.find(r => 
        r[emailCol] && String(r[emailCol]).trim().toLowerCase() === userEmail.trim().toLowerCase()
      );

      if (!targetRecord) {
        log(`No row found where '${emailCol}' matches '${userEmail}'.`, "warn");
        return;
      }

      log(`Found user record (Row #${targetRecord.id}). Updating timestamp...`);

      try {
        const table = grist.selectedTable || grist.getTable();
        const nowInSeconds = Math.floor(Date.now() / 1000);

        // Lock to avoid update loops on re-render
        hasUpdated = true;

        await table.update({
          id: targetRecord.id,
          fields: {
            [lastSeenCol]: nowInSeconds
          }
        });

        log(`✓ Updated 'Last Seen' for ${userEmail} on Row #${targetRecord.id}!`, 'success');
      } catch (err) {
        hasUpdated = false; // Reset lock on failure
        log(`Update failed: ${err.message || err}`, 'error');
        console.error("Full error:", err);
      }
    });
  </script>
</body>
</html>
