<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { font-family: sans-serif; font-size: 12px; color: #666; margin: 5px; }
  </style>
</head>
<body>
  <div id="status">Logging view...</div>

  <script>
    // 1. Specify the page name for this instance
    const PAGE_NAME = "Sales Dashboard"; 

    // 2. Request write access to update tables
    grist.ready({ requiredAccess: 'full' });

    // 3. Log the view once Grist widget API is ready
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const table = grist.getTable('PageViews');
        await table.insertRecords([{
          fields: { Page: PAGE_NAME }
        }]);
        document.getElementById('status').innerText = `Last seen logged for: ${PAGE_NAME}`;
      } catch (err) {
        document.getElementById('status').innerText = "Unable to record view.";
        console.error("View logging failed:", err);
      }
    });
  </script>
</body>
</html>
