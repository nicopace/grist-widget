<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: monospace;
      font-size: 11px;
      margin: 8px;
      background: #f8f9fa;
      color: #212529;
    }
    .log-entry { margin-bottom: 4px; padding: 4px 6px; border-radius: 3px; word-break: break-all; }
    .info { background: #e3f2fd; color: #0d47a1; }
    .success { background: #e8f5e9; color: #1b5e20; }
    .warn { background: #fff3e0; color: #e65100; }
    .error { background: #ffebee; color: #b71c1c; }
  </style>
</head>
<body>
  <div id="logs"></div>

  <script>
    // Name of the helper ping table
    const PING_TABLE_NAME = "UserPing";
    const WIDGET_VERSION = '1.3';
    // Unique per iframe load: if the panel ever shows two "Initializing" lines
    // with different run ids, the widget iframe itself restarted. A full
    // browser reload instead points outside this script (neither this file
    // nor grist-plugin-api.js contains any reload/navigation call).
    const RUN_ID = Math.random().toString(36).slice(2, 7);

    const logContainer = document.getElementById('logs');
    const MAX_LOG_ENTRIES = 200; // cap: an uncapped log lets any event storm bloat the tab until the browser kills it
    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.appendChild(entry);
      while (logContainer.children.length > MAX_LOG_ENTRIES) {
        logContainer.removeChild(logContainer.firstChild);
      }
      console.log(`[${type.toUpperCase()}]`, message);
    }

    // Loop guards: onRecords re-fires on every table write this widget makes,
    // so all writes below must be gated. hasSettled is set BEFORE any write
    // (guard-first). Kept in-memory only (no sessionStorage): a persisted flag
    // would permanently disable the widget in cloned tabs / Electron windows,
    // and the server-side staleness check already prevents update loops.
    const STALE_THRESHOLD_MS = 5 * 60 * 1000; // skip update if lastSeen is fresher than this
    const RETRY_BASE_MS = 60 * 1000;
    const RETRY_MAX_MS = 10 * 60 * 1000;
    let hasSettled = false;
    let isRunning = false;
    let mappingWarned = false;
    let configWarned = false;
    let failureCount = 0;
    let nextRetryTime = 0;

    function settle() {
      hasSettled = true;
    }

    // Identity cache: resolving the viewer email requires a ping write
    // (user.Email only evaluates in trigger formulas on new records), so
    // remember it per tab to avoid ping create/destroy churn on every load.
    // Scoped by document.referrer (the embedding Grist doc URL) so one tab
    // showing two docs can't mix identities. TTL bounds the risk of a stale
    // entry after an in-tab account switch.
    const EMAIL_CACHE_KEY = 'lastseen_email_v1';
    const EMAIL_CACHE_TTL_MS = 60 * 60 * 1000; // 1h
    function readCachedEmail() {
      try {
        const raw = sessionStorage.getItem(EMAIL_CACHE_KEY);
        if (!raw) return null;
        const entry = JSON.parse(raw);
        if (!entry || entry.doc !== document.referrer || !entry.email) return null;
        if (Date.now() - entry.time > EMAIL_CACHE_TTL_MS) return null;
        return entry.email;
      } catch (e) { return null; }
    }
    function writeCachedEmail(email) {
      try {
        sessionStorage.setItem(EMAIL_CACHE_KEY,
          JSON.stringify({ email, doc: document.referrer, time: Date.now() }));
      } catch (e) { /* storage unavailable: ping again next time */ }
    }

    async function pingForEmail() {
      const pingTable = grist.getTable(PING_TABLE_NAME);
      let createdId = null;
      try {
        // 1. Create temporary record in UserPing table
        const createdRes = await pingTable.create({ fields: {} });
        createdId = Array.isArray(createdRes) ? createdRes[0].id : (createdRes.id || createdRes);
        log(`Created temporary ping record #${createdId}.`);

        // 2. Fetch full table data via grist.docApi.fetchTable
        const pingData = await grist.docApi.fetchTable(PING_TABLE_NAME);

        // A healthy UserPing table is always ~empty (rows live only for the
        // ping round-trip). Hundreds of rows mean an old client leaked them,
        // and every load downloads all of them: empty the table in Grist.
        if (pingData && pingData.id && pingData.id.length > 100) {
          log(`Warning: '${PING_TABLE_NAME}' holds ${pingData.id.length} rows. It should stay ~empty; leaked rows slow every load. Consider deleting them in Grist.`, 'warn');
        }

        let activeEmail = null;
        if (pingData && pingData.id) {
          const index = pingData.id.indexOf(createdId);
          if (index !== -1 && pingData.User_Email) {
            activeEmail = pingData.User_Email[index];
          }
        }
        return activeEmail;
      } finally {
        // 3. Delete temporary ping record, even on failure
        if (createdId !== null) {
          try { await grist.getTable(PING_TABLE_NAME).destroy([createdId]); } catch (e) { /* ignore cleanup failure */ }
          log('Cleaned up ping record.');
        }
      }
    }
    function lastSeenAgeMs(value) {
      if (value === null || value === undefined || value === '') return Infinity;
      if (typeof value === 'number') {
        const ms = value < 1e12 ? value * 1000 : value; // Grist DateTime arrives in seconds
        return Date.now() - ms;
      }
      const parsed = Date.parse(value);
      return isNaN(parsed) ? Infinity : Date.now() - parsed;
    }

    log(`Initializing 'Last Seen' widget v${WIDGET_VERSION} (run ${RUN_ID})...`);

    try {
      grist.ready({
        requiredAccess: 'full',
        columns: [
          { name: 'userEmail', title: 'User Email Field', type: 'Text', optional: false },
          { name: 'lastSeen', title: 'Last Seen Field', type: 'DateTime', optional: false }
        ]
      });
      log("grist.ready() sent successfully.");
    } catch (e) {
      log(`Error during grist.ready(): ${e.message}`, 'error');
    }

    grist.onRecords(async (records, mappings) => {
      if (!mappings || !mappings.userEmail || !mappings.lastSeen) {
        if (!mappingWarned) {
          mappingWarned = true;
          log("Action required: Map both 'User Email Field' and 'Last Seen Field' in Widget side panel ->", "warn");
        }
        return;
      }

      if (hasSettled) return;
      if (isRunning) return; // re-entrant event while a run is in flight: drop it
      if (Date.now() < nextRetryTime) return; // backing off after a failure: no writes
      isRunning = true;

      // Worst-case fork bomb: widget bound to the ping table itself, so our
      // own create/destroy would re-trigger this handler. Stop terminally.
      if (records && records.length > 0 && Object.prototype.hasOwnProperty.call(records[0], 'User_Email')) {
        isRunning = false;
        settle();
        log(`Widget appears to be bound to the '${PING_TABLE_NAME}' table itself. Bind it to your User table instead.`, 'error');
        return;
      }

      let activeEmail = readCachedEmail();
      try {
        if (activeEmail) {
          log('Reusing cached viewer identity (no ping write).');
        } else {
          log("Resolving active user via trigger formula ping...");
          activeEmail = await pingForEmail();
          if (activeEmail) writeCachedEmail(activeEmail);
        }

        if (!activeEmail) {
          throw new Error(`Could not resolve user email. Ensure table '${PING_TABLE_NAME}' contains column 'User_Email' with trigger formula 'user.Email'.`);
        }

        log(`Active user resolved: ${activeEmail}`);

        // 4. Locate matching user row and update timestamp (only if stale)
        const emailCol = mappings.userEmail;
        const lastSeenCol = mappings.lastSeen;

        const targetRecord = records.find(r =>
          r[emailCol] && String(r[emailCol]).trim().toLowerCase() === activeEmail.trim().toLowerCase()
        );

        if (!targetRecord) {
          throw new Error(`No row found in target table where '${emailCol}' matches '${activeEmail}'.`);
        }

        if (lastSeenAgeMs(targetRecord[lastSeenCol]) < STALE_THRESHOLD_MS) {
          log(`'Last Seen' for ${activeEmail} is already fresh. Skipping update.`, 'success');
          failureCount = 0;
          settle();
          return;
        }

        log(`Updating Row #${targetRecord.id}...`);

        const mainTable = grist.selectedTable || grist.getTable();
        const nowInSeconds = Math.floor(Date.now() / 1000);

        // NB: isRunning (set above) already drops re-entrant events during
        // this await, so settle only AFTER success: settling before would
        // permanently disable retries when the update itself fails.
        await mainTable.update({
          id: targetRecord.id,
          fields: {
            [lastSeenCol]: nowInSeconds
          }
        });

        settle();

        log(`✓ Updated 'Last Seen' for ${activeEmail} on Row #${targetRecord.id}!`, 'success');
        failureCount = 0;

      } catch (err) {
        console.error("Full error:", err);
        const msg = err && err.message ? err.message : String(err);
        // Permanent config errors settle terminally instead of retrying forever.
        if (/formula|denied|permission|not found|no row found|could not resolve/i.test(msg)) {
          if (!configWarned) {
            configWarned = true;
            log(`Ping workflow stopped: ${msg}`, 'error');
          }
          settle();
        } else {
          failureCount += 1;
          nextRetryTime = Date.now() + Math.min(RETRY_BASE_MS * (2 ** (failureCount - 1)), RETRY_MAX_MS);
          log(`Ping workflow failed (retry in backoff): ${msg}`, 'error');
        }
      } finally {
        isRunning = false;
      }
    });
  </script>
</body>
</html>
